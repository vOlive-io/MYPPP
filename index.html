<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div id="postbasedTab" class="tabcontent">
            postbased
        </div>
        <div id="farmTab" class="tabcontent">
            farm
        </div>
        <div id="gameplayTab" class="tabcontent">
            gameplay
        </div>
        <div id="inventoryTab" class="tabcontent">
            inventory
        </div>
        <div id="storeTab" class="tabcontent">
            store
        </div>

        <div id="tabSelectorContainer" class="tabSelector">
            <button class="tablinks" onclick="openTab(event, 'postbasedTab')"><img src="postbased-icon.png" alt="Post-Based"></button>
            <button class="tablinks" onclick="openTab(event, 'farmTab')"><img src="farm-icon.png" alt="Farm"></button>
            <button class="tablinks" onclick="openTab(event, 'gameplayTab')"><img src="gameplay-icon.png" alt="Gameplay"></button>
            <button class="tablinks" onclick="openTab(event, 'inventoryTab')"><img src="inventory-icon.png" alt="Inventory"></button>
            <button class="tablinks" onclick="openTab(event, 'storeTab')"><img src="store-icon.png" alt="Store"></button>
        </div>
    </body>
</html>
