<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script type="module" src="script.js"></script>
    </head>
    <body>
        <div id="postbasedTab" class="tabcontent" style="display: block;">
            postbased
        </div>
        <div id="farmTab" class="tabcontent">
            farm
        </div>
        <div id="gameplayTab" class="tabcontent">
            gameplay
        </div>
        <div id="inventoryTab" class="tabcontent">
            inventory
        </div>
        <div id="storeTab" class="tabcontent">
            store
        </div>

        <div id="tabSelectorContainer" class="tabSelector">
            <button class="tablinks active" onclick="openTab(event, 'postbasedTab')"><img src="icons/postBased.png" alt="Post-Based"></button>
            <button class="tablinks" onclick="openTab(event, 'farmTab')"><img src="icons/farm.png" alt="Farm"></button>
            <button class="tablinks" onclick="openTab(event, 'gameplayTab')"><img src="icons/gameplay.png" alt="Gameplay"></button>
            <button class="tablinks" onclick="openTab(event, 'inventoryTab')"><img src="icons/inventory.png" alt="Inventory"></button>
            <button class="tablinks" onclick="openTab(event, 'storeTab')"><img src="icons/store.png" alt="Store"></button>
        </div>
    </body>
</html>
